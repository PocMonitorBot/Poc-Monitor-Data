name: schedule

on:
  # 每小时 :13 与 :43 双触发（错开整点拥堵分钟槽 + 翻倍触发机会：
  # GitHub 高负载时段 cron 会被延迟/丢弃，实测单分钟执行率仅 12-16%）
  schedule:
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:

# GITHUB_TOKEN 推送本仓库（公共仓库，Actions 免费不限量）
permissions:
  contents: write

# 与 merge 共享并发组，串行化推送防冲突
concurrency:
  group: poc-data-repo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ===== 步骤1：拉取本数据仓库到 data/ 子目录 =====
      - name: Check out data repo (self)
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 1

      # ===== 步骤2：只读拉取私有源码仓库到 src/ 子目录 =====
      # 保密性：源码仅存在于 runner 临时目录，与 data/ 物理隔离
      - name: Check out private source repo
        uses: actions/checkout@v4
        with:
          repository: PocMonitorBot/Poc-Monitor-Source
          token: ${{ secrets.SRC_REPO_TOKEN }}
          path: src
          fetch-depth: 1

      - name: Set up Go 1.18
        uses: actions/setup-go@v4
        with:
          go-version: 1.18

      # ===== 步骤3：编译并运行监控 =====
      - name: Build and run monitor
        env:
          barkToken: ${{ secrets.BARK_TOKEN }}
          githubToken: ${{ secrets.SRC_REPO_TOKEN }}
        run: |
          cd src
          go build -o poc-monitor .
          cp poc-monitor blacklist.yaml ../data/
          cd ../data
          ./poc-monitor
          rm poc-monitor blacklist.yaml

      # ===== 步骤4：推送数据（冲突自动恢复版） =====
      - name: Push data
        run: |
          cd data
          git config user.email "${{ vars.BOT_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}"
          git config user.name "${{ vars.BOT_NAME || github.actor }}"
          MSG="Auto Update $(date --rfc-3339=seconds)"
          git add .
          git diff --staged --quiet || git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            fi
            # 修复: rebase 冲突时中止并基于远端重建提交
            # （旧逻辑卡在 unmerged 状态导致 3 连败，根因：与 merge 推送竞态修改同一 CVE 文件）
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git add -A
            git commit -m "$MSG (conflict-rebuild)" --allow-empty
            git push && exit 0
            echo "push 失败，20s 后重试 ($i/3)"
            sleep 20
          done
          exit 1
